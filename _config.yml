title: Patrick Cannon
tagline: AI Safety
description: "Independent AI safety researcher working on reliable oversight for language-model reasoning."
url: https://patrickcannon.cc
baseurl: ""
lang: en-GB
author:
  name: Patrick Cannon
  url: https://patrickcannon.cc
  twitter: pw_cannon
twitter:
  username: pw_cannon
  card: summary_large_image

permalink: pretty
kramdown:
  math_engine: null

plugins:
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      mathjax: true

exclude:
  - README.md
  - assets/fonts/README.md
  - CLAUDE.md
  - _design
  - docs
  - script
  - jekyll-theme-minimal.gemspec
  - Gemfile
  - Gemfile.lock
  - LICENSE

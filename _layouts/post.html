<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- MathJax Configuration -->
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          packages: {'[+]': ['ams', 'noerrors']}
        },
        loader: {
          load: ['[tex]/ams', '[tex]/noerrors']
        },
        svg: {
          fontCache: 'global'
        },
        options: {
          renderActions: {
            addMenu: []
          }
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body class="post-page">
    <nav class="post-nav top-nav">
      <div class="nav-inner">
        <a href="{{ "/" | absolute_url }}" class="nav-link">{{ site.title | default: "Home" }}</a>
        <span class="nav-sep">/</span>
        <a href="{{ "/blog" | absolute_url }}" class="nav-link">Blog</a>
      </div>
    </nav>

    <article class="post-article">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        {% if page.date %}
        <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%B %-d, %Y" }}
        </time>
        {% endif %}
      </header>

      <div class="post-content">
        {{ content }}
      </div>
    </article>

    <footer class="post-footer">
      <div class="footer-inner">
        <a href="{{ "/blog" | absolute_url }}" class="back-link">&larr; Back to blog</a>
        <span class="footer-sep">·</span>
        <a href="{{ "/" | absolute_url }}" class="back-link">Home</a>
      </div>
    </footer>

    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>

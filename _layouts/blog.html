<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — {{ site.title }}</title>

  <!-- DM Sans -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  {% seo %}
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>

<!-- Inline SVG noise grain -->
<svg class="noise-overlay" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" />
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>

<!-- Static blobs -->
<div class="blobs">
  <div class="blob" style="width:380px;height:300px;background:#7A9AB8;top:-6%;left:-5%;"></div>
  <div class="blob" style="width:300px;height:240px;background:#6888A8;top:30%;left:-3%;"></div>
  <div class="blob" style="width:340px;height:260px;background:#5C7EA0;bottom:-5%;left:3%;"></div>
  <div class="blob" style="width:440px;height:220px;background:#7090B0;bottom:-3%;left:30%;"></div>
  <div class="blob" style="width:360px;height:280px;background:#6484A4;bottom:-6%;right:-3%;"></div>
  <div class="blob" style="width:280px;height:320px;background:#5878A0;top:40%;right:-2%;"></div>
  <div class="blob" style="width:320px;height:240px;background:#6C8CB0;top:16%;right:10%;"></div>
  <div class="blob" style="width:260px;height:200px;background:#7494B4;top:55%;left:14%;"></div>
  <div class="blob" style="width:220px;height:180px;background:#6080A8;top:65%;left:40%;"></div>
  <div class="blob" style="width:280px;height:200px;background:#6C90B0;top:8%;left:36%;"></div>
</div>

<div class="page-wrapper">

<!-- Contour orb -->
{% include contour_orb.html %}

<header>
  <span class="name">{{ site.title }}</span>
  <div class="header-mid"></div>
  <nav>
    <a href="{{ "/" | relative_url }}">home</a>
    <a href="{{ "/blog" | relative_url }}" class="active">blog</a>
    <a href="{{ "/research" | relative_url }}">research</a>
  </nav>
</header>

<div class="layout">
  <div class="sidebar">
    <a href="{{ "/" | relative_url }}" class="back-link">&larr; home</a>
  </div>

  <div class="main">
    {{ content }}
  </div>

  <div class="right-panel"></div>
</div>

<footer>
  <span>&copy; 2026 Patrick Cannon</span>
</footer>

</div><!-- .page-wrapper -->

</body>
</html>

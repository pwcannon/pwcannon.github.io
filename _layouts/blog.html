<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body class="post-page">
    <nav class="post-nav top-nav">
      <div class="nav-inner">
        <a href="{{ "/" | absolute_url }}" class="nav-link">{{ site.title | default: "Home" }}</a>
        <span class="nav-sep">/</span>
        <span style="color: var(--charcoal);">Blog</span>
      </div>
    </nav>

    <main class="blog-index">
      {{ content }}
    </main>

    <footer class="post-footer">
      <div class="footer-inner">
        <a href="{{ "/" | absolute_url }}" class="back-link">&larr; Home</a>
      </div>
    </footer>

    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>

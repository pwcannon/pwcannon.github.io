<!doctype html>
<html lang="{{ site.lang | default: "en-GB" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
    {% seo %}
    {% include favicons.html %}
    <link rel="preload" href="{{ "/assets/fonts/geist-variable-1.7.2.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% include asset-url.html path="/assets/css/style.css" %}">
    {% if page.layout == "post" %}
    <link rel="stylesheet" href="{% include asset-url.html path="/assets/css/article.css" %}">
    {% endif %}
    {% if page.closing_quote %}
    <link rel="stylesheet" href="{% include asset-url.html path="/assets/css/closing-quote.css" %}">
    {% endif %}
    {% if page.body_class == "home-page" %}
    <link rel="stylesheet" href="{% include asset-url.html path="/assets/css/home-experiments.css" %}">
    {% endif %}
    {% if page.mathjax %}
    <script>
      window.MathJax = {
        {% if page.layout == "post" %}chtml: { mtextInheritFont: true },{% endif %}
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true
        },
        options: { renderActions: { addMenu: [] } }
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endif %}
  </head>
  <body class="{% if page.body_class %}{{ page.body_class }}{% else %}{{ page.layout }}-page{% endif %}">
    <div class="paper-surface" aria-hidden="true"></div>
    {{ content }}
  </body>
</html>

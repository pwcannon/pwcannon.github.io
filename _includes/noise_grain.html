<!-- Film grain overlay (shared by all layouts).
     Must be included AFTER .page-wrapper closes: paints over blobs/orb,
     beneath z-indexed content. -->
<!-- Inline SVG noise grain (after page content in DOM: paints over blobs and orb, beneath z-indexed content) -->
<svg class="noise-overlay" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" />
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>
